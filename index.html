<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<meta
  name="theme-color"
  content="#4f46e5">

<title>
German Gender Trainer A1.1
</title>

<link
  rel="manifest"
  href="manifest.json">

<link
  rel="apple-touch-icon"
  href="icon-192.png">

<style>

:root{
  --blue:#2563eb;
  --pink:#ec4899;
  --green:#16a34a;
  --purple:#4f46e5;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:system-ui,sans-serif;
  background:#f8fafc;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:12px;
}

.card{
  width:100%;
  max-width:480px;
  height:720px;
  background:white;
  border-radius:24px;
  padding:18px;
  display:flex;
  flex-direction:column;
  position:relative;
  box-shadow:
    0 10px 30px rgba(0,0,0,.15);
}

.title{
  text-align:center;
  font-size:1.8rem;
  font-weight:800;
  color:var(--purple);
}

.stats{
  text-align:center;
  margin-top:10px;
  color:#475569;
  font-weight:700;
}

.noun{
  height:140px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:2.8rem;
  font-weight:800;
}

.buttons{
  text-align:center;
}

.btn{
  border:none;
  border-radius:14px;
  padding:14px 20px;
  margin:5px;
  color:white;
  font-size:1rem;
  font-weight:800;
  cursor:pointer;
}

.der{
  background:var(--blue);
}

.die{
  background:var(--pink);
}

.das{
  background:var(--green);
}

.feedback-area{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
}

.feedback{
  width:100%;
  min-height:250px;
  border-radius:18px;
  padding:18px;
  text-align:center;
}

.correct{
  background:#dcfce7;
  border:3px solid #22c55e;
}

.wrong{
  background:#fee2e2;
  border:3px solid #ef4444;
}

.result{
  font-size:2rem;
  font-weight:900;
}

.gender{
  font-size:1.5rem;
  margin-top:12px;
}

.masculine{
  color:var(--blue);
}

.feminine{
  color:var(--pink);
}

.neuter{
  color:var(--green);
}

.info{
  margin-top:10px;
  font-size:1.1rem;
}

.hint{
  margin-top:15px;
  color:#64748b;
}

.new50{
  position:absolute;
  right:18px;
  bottom:18px;
  border:none;
  border-radius:14px;
  background:#4f46e5;
  color:white;
  padding:12px 16px;
  font-size:1rem;
  font-weight:800;
  cursor:pointer;
}

@media (prefers-color-scheme: dark){

  body{
    background:#111827;
  }

  .card{
    background:#1f2937;
    color:white;
  }

  .stats{
    color:#cbd5e1;
  }
}

</style>
</head>

<body>

<div class="card" id="card">

<div class="title">
🇩🇪 German Gender Trainer A1.1
</div>

<div
  id="stats"
  class="stats">
Loading...
</div>

<div
  id="noun"
  class="noun">
...
</div>

<div
  id="buttons"
  class="buttons">

<button class="btn der">
DER
</button>

<button class="btn die">
DIE
</button>

<button class="btn das">
DAS
</button>

</div>

<div class="feedback-area">
<div id="feedback"></div>
</div>

<button
  id="new50"
  class="new50">

🔄 New 50

</button>

</div>

<script src="vocabulary-part1.js"></script>

<script>

let vocabulary = [
  ...(window.vocab1 || [])
];

let round = [];

let index = 0;
let score = 0;
let answered = 0;
let waitingForNext = false;

const nounEl =
  document.getElementById("noun");

const statsEl =
  document.getElementById("stats");

const feedbackEl =
  document.getElementById("feedback");

const buttonsEl =
  document.getElementById("buttons");

function shuffle(array){

  const arr = [...array];

  for(
    let i = arr.length - 1;
    i > 0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [arr[i], arr[j]] =
      [arr[j], arr[i]];
  }

  return arr;
}

function createNewRound(){

  round =
    shuffle(vocabulary)
      .slice(
        0,
        Math.min(
          50,
          vocabulary.length
        )
      );

  index = 0;
  score = 0;
  answered = 0;
  waitingForNext = false;

  buttonsEl.style.display =
    "block";

  showWord();
}

function updateStats(){

  statsEl.textContent =
    `Word ${Math.min(index + 1,50)} / 50 • Score ${score}/${answered}`;

}

function showFinished(){

  nounEl.textContent =
    "🎉 Finished";

  feedbackEl.innerHTML =

  `
  <div class="feedback correct">

    <div class="result">
      🎉 Round Complete
    </div>

    <div class="info">
      Score:
      <strong>
        ${score}/${answered}
      </strong>
    </div>

    <div class="hint">
      Press 🔄 New 50
      for another random round
    </div>

  </div>
  `;

  buttonsEl.style.display =
    "none";

  statsEl.textContent =
    "50 / 50 Completed";

}

function showWord(){

  if(
    round.length === 0
  ){
    return;
  }

  if(
    index >= round.length
  ){
    showFinished();
    return;
  }

  const word =
    round[index];

  nounEl.textContent =
    word.noun;

  feedbackEl.innerHTML = "";

  waitingForNext = false;

  updateStats();
}

function answer(article){

  if(
    waitingForNext
  ){
    return;
  }

  const word =
    round[index];

  answered++;

  const correct =
    article ===
    word.gender;

  if(correct){
    score++;
  }

  const colorClass =

    word.gender === "der"
      ? "masculine"

    : word.gender === "die"
      ? "feminine"

    : "neuter";

  feedbackEl.innerHTML =

  `
  <div class="feedback ${correct ? "correct" : "wrong"}">

    <div class="result">
      ${
        correct
          ? "✅ CORRECT!"
          : "❌ WRONG!"
      }
    </div>

    <div class="gender ${colorClass}">

      <strong>
        ${word.gender}
        ${word.noun}
      </strong>

    </div>

    <div class="info">
      Plural:
      <strong>
        ${word.plural}
      </strong>
    </div>

    <div class="info">
      English:
      <strong>
        ${word.english}
      </strong>
    </div>

    <div class="hint">
      Tap anywhere to continue
    </div>

  </div>
  `;

  waitingForNext = true;

  updateStats();
}document
  .querySelector(".der")
  .addEventListener(
    "click",
    (e) => {

      e.stopPropagation();

      answer("der");

    }
  );

document
  .querySelector(".die")
  .addEventListener(
    "click",
    (e) => {

      e.stopPropagation();

      answer("die");

    }
  );

document
  .querySelector(".das")
  .addEventListener(
    "click",
    (e) => {

      e.stopPropagation();

      answer("das");

    }
  );

document
  .getElementById("new50")
  .addEventListener(
    "click",
    (e) => {

      e.stopPropagation();

      createNewRound();

    }
  );

document
  .getElementById("card")
  .addEventListener(
    "click",
    () => {

      if(!waitingForNext){
        return;
      }

      index++;

      showWord();

    }
  );

/* PWA Service Worker */

if(
  "serviceWorker" in navigator
){

  window.addEventListener(
    "load",
    () => {

      navigator
        .serviceWorker
        .register(
          "./service-worker.js"
        )
        .then(() => {

          console.log(
            "Service Worker Registered"
          );

        })
        .catch(error => {

          console.error(
            "Service Worker Error:",
            error
          );

        });

    }
  );

}

/* Start App */

createNewRound();

</script>

</body>
</html>
